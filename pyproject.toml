[project]
name = "stt-ai"
version = "0.2.0"
description = "Lokální přepis audia s Whisper, CUDA a Apple MLX"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.30,<1", "tqdm>=4.66,<5",
  "mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
hf = ["transformers>=4.52,<5", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
